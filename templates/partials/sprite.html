<!-- ============================================================
     SVG SPRITE  -  every sticker used on the slides is drawn here
     (all artwork is original, made with SVG so it is always sharp)
     Use with:  <use href="#disco"/>
     ============================================================ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <radialGradient id="gDisco" cx="35%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".25" stop-color="#bcd8f6"/>
      <stop offset=".7" stop-color="#4f86c6"/>
      <stop offset="1" stop-color="#1f4a86"/>
    </radialGradient>
    <pattern id="pGrid" width="9" height="9" patternUnits="userSpaceOnUse">
      <path d="M0 0H9M0 0V9" stroke="#0d2f5e" stroke-opacity=".5" stroke-width="1"/>
    </pattern>
    <linearGradient id="gFlame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff8a1f"/>
      <stop offset=".6" stop-color="#ffc83d"/>
      <stop offset="1" stop-color="#fff2a8"/>
    </linearGradient>
  </defs>

  <!-- disco ball -->
  <symbol id="disco" viewBox="0 0 100 120">
    <path d="M50 0V16" stroke="#8b96a8" stroke-width="2"/>
    <rect x="42" y="14" width="16" height="10" rx="3" fill="#9aa7bb"/>
    <circle cx="50" cy="72" r="46" fill="url(#gDisco)"/>
    <circle cx="50" cy="72" r="46" fill="url(#pGrid)"/>
    <ellipse cx="32" cy="50" rx="12" ry="8" fill="#fff" opacity=".55" transform="rotate(-35 32 50)"/>
    <path d="M70 40l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#fff"/>
    <circle cx="50" cy="72" r="46" fill="none" stroke="#1b3f79" stroke-width="1.5"/>
  </symbol>

  <!-- navy star -->
  <symbol id="star" viewBox="0 0 100 100">
    <path d="M50 4L62 38 98 38 69 59 80 94 50 73 20 94 31 59 2 38 38 38Z"
          fill="#1d4a94" stroke="#9cc1ee" stroke-width="4" stroke-linejoin="round"/>
  </symbol>

  <!-- sparkle (colour from CSS `color`) -->
  <symbol id="sparkle" viewBox="0 0 100 100">
    <path d="M50 0Q54 46 100 50Q54 54 50 100Q46 54 0 50Q46 46 50 0Z" fill="currentColor"/>
  </symbol>

  <!-- balloon (colour from CSS `color`) -->
  <symbol id="balloon" viewBox="0 0 60 110">
    <path d="M30 70 C18 90 42 92 30 110" stroke="#7a8aa6" fill="none" stroke-width="1.6"/>
    <ellipse cx="30" cy="36" rx="26" ry="33" fill="currentColor"/>
    <path d="M30 68l-5 8h10z" fill="currentColor"/>
    <ellipse cx="20" cy="22" rx="6" ry="11" fill="#fff" opacity=".45" transform="rotate(25 20 22)"/>
  </symbol>

  <!-- camera -->
  <symbol id="camera" viewBox="0 0 100 80">
    <rect x="4" y="18" width="92" height="58" rx="10" fill="#1d4a94"/>
    <rect x="14" y="8" width="26" height="14" rx="4" fill="#2d63b8"/>
    <rect x="66" y="10" width="20" height="10" rx="3" fill="#8fb7ea"/>
    <circle cx="50" cy="47" r="22" fill="#e8f1fc"/>
    <circle cx="50" cy="47" r="16" fill="#12336b"/>
    <circle cx="50" cy="47" r="8" fill="#2d63b8"/>
    <circle cx="44" cy="41" r="3.5" fill="#fff" opacity=".85"/>
  </symbol>

  <!-- envelope -->
  <symbol id="envelope" viewBox="0 0 220 150">
    <rect x="6" y="14" width="208" height="128" rx="6" fill="#a9c8ec" stroke="#6f9bd0" stroke-width="3"/>
    <path d="M6 140L84 70M214 140L136 70" stroke="#6f9bd0" stroke-width="3" fill="none"/>
    <path d="M6 20L110 94 214 20" fill="#c8dcf4" stroke="#6f9bd0" stroke-width="3" stroke-linejoin="round"/>
    <path d="M110 70c-9-10-22 2-10 12l10 10 10-10c12-10-1-22-10-12z" fill="#2d63b8"/>
  </symbol>

  <!-- small flower -->
  <symbol id="flower" viewBox="0 0 40 40">
    <circle cx="20" cy="9" r="8.5" fill="#eef5fd"/>
    <circle cx="30.5" cy="16.6" r="8.5" fill="#e4effb"/>
    <circle cx="26.5" cy="29" r="8.5" fill="#eef5fd"/>
    <circle cx="13.5" cy="29" r="8.5" fill="#e4effb"/>
    <circle cx="9.5" cy="16.6" r="8.5" fill="#eef5fd"/>
    <g fill="none" stroke="#9cc1ee" stroke-width="1"><circle cx="20" cy="9" r="8.5"/><circle cx="30.5" cy="16.6" r="8.5"/><circle cx="26.5" cy="29" r="8.5"/><circle cx="13.5" cy="29" r="8.5"/><circle cx="9.5" cy="16.6" r="8.5"/></g>
    <circle cx="20" cy="20" r="5" fill="#6fa3dc"/>
  </symbol>

  <!-- bouquet -->
  <symbol id="bouquet" viewBox="0 0 180 240">
    <path d="M40 90C10 70 20 40 50 60Z M140 90C170 70 160 40 130 60Z" fill="#5b8fc7"/>
    <path d="M90 100L90 150" stroke="#3d7f9c" stroke-width="6"/>
    <use href="#flower" x="14" y="52" width="46" height="46"/>
    <use href="#flower" x="120" y="52" width="46" height="46"/>
    <use href="#flower" x="38" y="22" width="50" height="50"/>
    <use href="#flower" x="94" y="20" width="50" height="50"/>
    <use href="#flower" x="62" y="52" width="56" height="56"/>
    <path d="M24 98L156 98L106 232L74 232Z" fill="#3f74bf" stroke="#1d4a94" stroke-width="3" stroke-linejoin="round"/>
    <path d="M24 98L90 140 156 98" fill="#6fa3dc" stroke="#1d4a94" stroke-width="3" stroke-linejoin="round"/>
    <path d="M90 150c-12-14-28-8-26 6 2 10 18 12 26-6z M90 150c12-14 28-8 26 6-2 10-18 12-26-6z" fill="#c9a45c" stroke="#8a6a2a" stroke-width="2"/>
    <circle cx="90" cy="152" r="6" fill="#e3c27e" stroke="#8a6a2a" stroke-width="2"/>
  </symbol>

  <!-- stacked gift boxes -->
  <symbol id="giftbox" viewBox="0 0 220 240">
    <rect x="22" y="132" width="176" height="100" rx="4" fill="#2a5aa6" stroke="#17376e" stroke-width="3"/>
    <rect x="12" y="118" width="196" height="26" rx="4" fill="#3b6fbe" stroke="#17376e" stroke-width="3"/>
    <rect x="98" y="118" width="24" height="114" fill="#c9a45c"/>
    <rect x="42" y="56" width="136" height="64" rx="4" fill="#8fb7ea" stroke="#3a6aa8" stroke-width="3"/>
    <rect x="32" y="44" width="156" height="22" rx="4" fill="#b9d3f2" stroke="#3a6aa8" stroke-width="3"/>
    <rect x="98" y="44" width="24" height="76" fill="#c9a45c"/>
    <path d="M110 44C84 10 56 22 80 40 90 46 104 46 110 44Z M110 44C136 10 164 22 140 40 130 46 116 46 110 44Z" fill="#d9b86c" stroke="#8a6a2a" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="110" cy="44" r="9" fill="#e3c27e" stroke="#8a6a2a" stroke-width="3"/>
    <g fill="#fff" opacity=".85"><circle cx="50" cy="160" r="3"/><circle cx="72" cy="196" r="3"/><circle cx="150" cy="170" r="3"/><circle cx="170" cy="212" r="3"/><circle cx="60" cy="80" r="2.5"/><circle cx="156" cy="96" r="2.5"/></g>
  </symbol>

  <!-- small gift (for the kitten) -->
  <symbol id="gift" viewBox="0 0 60 60">
    <rect x="6" y="22" width="48" height="34" rx="3" fill="#4fa0e0" stroke="#1d5fa6" stroke-width="2.5"/>
    <rect x="3" y="14" width="54" height="12" rx="3" fill="#7cbcf0" stroke="#1d5fa6" stroke-width="2.5"/>
    <rect x="26" y="14" width="8" height="42" fill="#fff"/>
    <path d="M30 14C18 0 8 8 18 14Z M30 14C42 0 52 8 42 14Z" fill="#fff" stroke="#1d5fa6" stroke-width="2"/>
  </symbol>

  <!-- party hat -->
  <symbol id="hat" viewBox="0 0 60 80">
    <path d="M30 6L6 74Q30 82 54 74Z" fill="#4fa0e0" stroke="#1d5fa6" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M19 40Q30 46 41 40M12 60Q30 68 48 60" stroke="#fff" stroke-width="4" fill="none" opacity=".75"/>
    <circle cx="30" cy="7" r="7" fill="#fff" stroke="#1d5fa6" stroke-width="2"/>
  </symbol>

  <!-- the kitten (original drawing) -->
  <symbol id="cat" viewBox="0 0 220 300">
    <path d="M168 250C214 240 214 190 188 176" stroke="#d98f46" stroke-width="14" fill="none" stroke-linecap="round"/>
    <ellipse cx="110" cy="222" rx="58" ry="70" fill="#e9a65e"/>
    <ellipse cx="110" cy="238" rx="34" ry="48" fill="#f8dfb6"/>
    <ellipse cx="80" cy="283" rx="21" ry="11" fill="#f8dfb6" stroke="#d98f46" stroke-width="2"/>
    <ellipse cx="140" cy="283" rx="21" ry="11" fill="#f8dfb6" stroke="#d98f46" stroke-width="2"/>
    <path d="M58 96L50 40 100 68Z" fill="#e9a65e"/>
    <path d="M162 96L170 40 120 68Z" fill="#e9a65e"/>
    <path d="M64 86L60 56 88 72Z" fill="#f3a7a0"/>
    <path d="M156 86L160 56 132 72Z" fill="#f3a7a0"/>
    <circle cx="110" cy="124" r="62" fill="#e9a65e"/>
    <path d="M110 64v20M96 66l4 16M124 66l-4 16" stroke="#c98038" stroke-width="5" stroke-linecap="round"/>
    <ellipse cx="110" cy="146" rx="30" ry="21" fill="#f9e6c6"/>
    <ellipse cx="70" cy="146" rx="13" ry="8" fill="#ff9fb0" opacity=".55"/>
    <ellipse cx="150" cy="146" rx="13" ry="8" fill="#ff9fb0" opacity=".55"/>
    <circle cx="86" cy="122" r="16" fill="#2a1b14"/>
    <circle cx="134" cy="122" r="16" fill="#2a1b14"/>
    <circle cx="81" cy="116" r="5.5" fill="#fff"/><circle cx="130" cy="116" r="5.5" fill="#fff"/>
    <circle cx="91" cy="128" r="2.6" fill="#fff"/><circle cx="139" cy="128" r="2.6" fill="#fff"/>
    <path d="M72 100Q84 94 98 102M148 100Q136 94 122 102" stroke="#a56a2a" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M104 138h12l-6 8z" fill="#f08b9c"/>
    <path d="M110 146v5M110 151q-8 8-16 2M110 151q8 8 16 2" stroke="#6b3d1d" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M50 142l-30-6M50 150l-30 4M170 142l30-6M170 150l30 4" stroke="#fff" stroke-width="2" opacity=".9" stroke-linecap="round"/>
    <g transform="rotate(-8 110 66)">
      <path d="M110 4L76 72Q110 84 144 72Z" fill="#4fa0e0" stroke="#1d5fa6" stroke-width="3" stroke-linejoin="round"/>
      <path d="M92 38Q110 46 128 38M84 56Q110 66 136 56" stroke="#fff" stroke-width="5" fill="none" opacity=".75"/>
      <circle cx="110" cy="6" r="8" fill="#fff" stroke="#1d5fa6" stroke-width="2.5"/>
    </g>
  </symbol>

  <!-- teddy bear -->
  <symbol id="bear" viewBox="0 0 130 150">
    <ellipse cx="65" cy="112" rx="38" ry="36" fill="#c98e5a"/>
    <ellipse cx="65" cy="120" rx="22" ry="24" fill="#e8c397"/>
    <circle cx="26" cy="128" r="12" fill="#c98e5a"/><circle cx="104" cy="128" r="12" fill="#c98e5a"/>
    <circle cx="30" cy="50" r="16" fill="#c98e5a"/><circle cx="100" cy="50" r="16" fill="#c98e5a"/>
    <circle cx="30" cy="50" r="8" fill="#e8c397"/><circle cx="100" cy="50" r="8" fill="#e8c397"/>
    <circle cx="65" cy="68" r="38" fill="#c98e5a"/>
    <ellipse cx="65" cy="80" rx="18" ry="14" fill="#e8c397"/>
    <circle cx="52" cy="62" r="4.5" fill="#2a1b14"/><circle cx="78" cy="62" r="4.5" fill="#2a1b14"/>
    <ellipse cx="65" cy="76" rx="6" ry="4.5" fill="#3a2418"/>
    <path d="M65 80v5M65 85q-6 6-12 1M65 85q6 6 12 1" stroke="#3a2418" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M65 8L44 40Q65 48 86 40Z" fill="#4fa0e0" stroke="#1d5fa6" stroke-width="2.5" stroke-linejoin="round"/>
    <circle cx="65" cy="9" r="5.5" fill="#fff" stroke="#1d5fa6" stroke-width="2"/>
  </symbol>

  <!-- hanging garland (beads + star) -->
  <symbol id="garland" viewBox="0 0 170 340">
    {% for x, ln in [(28,190),(85,310),(140,240)] %}
    <path d="M{{x}} 0C{{x+7}} {{ln//3}} {{x-7}} {{2*ln//3}} {{x}} {{ln}}" fill="none" stroke="#7b8ea8" stroke-width="2"/>
    {% for k in range(1, ln//28) %}
    <circle cx="{{x + (4 if k%2 else -4)}}" cy="{{k*26}}" r="{{6 if k%3 else 8}}" fill="{{ ['#8fb7ea','#2c5aa0','#d7e6f8','#4f86c6'][k%4] }}" stroke="#1d4a94" stroke-width="1"/>
    {% endfor %}
    <use href="#star" x="{{x-14}}" y="{{ln-6}}" width="28" height="28"/>
    {% endfor %}
  </symbol>

  <!-- binder clip -->
  <symbol id="clip" viewBox="0 0 60 110">
    <path d="M12 44Q-2 12 20 6M48 44Q62 12 40 6" fill="none" stroke="#b8923f" stroke-width="3.5"/>
    <rect x="6" y="40" width="48" height="66" rx="5" fill="#dcbc6b" stroke="#9b7b30" stroke-width="3"/>
    <rect x="14" y="48" width="32" height="10" rx="3" fill="#f0d998"/>
  </symbol>

  <!-- swirl decoration -->
  <symbol id="swirl" viewBox="0 0 200 240">
    <path d="M30 230C0 130 120 160 104 78C96 30 40 40 58 78C70 104 110 92 104 64" fill="none" stroke="#2d63b8" stroke-width="12" stroke-linecap="round"/>
    <path d="M30 230C0 130 120 160 104 78C96 30 40 40 58 78C70 104 110 92 104 64" fill="none" stroke="#9cc1ee" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 12"/>
    <path d="M170 230C150 170 196 150 180 110C172 84 140 92 150 112" fill="none" stroke="#2d63b8" stroke-width="10" stroke-linecap="round"/>
  </symbol>

  <symbol id="heart" viewBox="0 0 100 95">
    <path d="M50 90C-10 40 20 -5 50 30 80 -5 110 40 50 90Z" fill="currentColor"/>
  </symbol>

  <symbol id="lips" viewBox="0 0 90 50">
    <path d="M45 8C30 -2 10 6 4 24 20 46 70 46 86 24 80 6 60 -2 45 8Z" fill="#2a5aa6"/>
    <path d="M8 24Q45 34 82 24" stroke="#cfe2f8" stroke-width="2" fill="none"/>
    <path d="M30 12Q36 8 42 12" stroke="#fff" stroke-width="2" fill="none" opacity=".7"/>
  </symbol>
</svg>
