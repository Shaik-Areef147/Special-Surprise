services:
  - type: web
    name: birthday-surprise
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BIRTHDAY_NAME
        value: Your Name
      - key: BIRTHDAY_SENDER
        value: Me
